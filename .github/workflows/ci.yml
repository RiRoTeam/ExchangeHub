name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn test -B

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Type-check and build production bundle
        working-directory: frontend
        run: npm run build

      - name: Audit all dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  deployment-config:
    name: Validate production Compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create disposable validation secrets
        run: |
          install -d -m 700 deploy/secrets
          printf '%s' 'ci-only-postgres-admin-password' > deploy/secrets/postgres_admin_password
          printf '%s' 'ci-only-db-app-password' > deploy/secrets/db_app_password
          printf '%s' 'ci-only-jwt-secret-that-is-longer-than-thirty-two-bytes' > deploy/secrets/jwt_secret
          : > deploy/secrets/bootstrap_admin_email
          : > deploy/secrets/bootstrap_admin_name
          : > deploy/secrets/bootstrap_admin_password

      - name: Validate production Compose model
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Remove disposable validation secrets
        if: always()
        run: rm -rf deploy/secrets
