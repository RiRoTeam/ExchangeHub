x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: exchangehub-postgres:16.15-pinned
    build:
      context: ./deploy/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.production}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env.production}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      DB_APP_USER: ${DB_APP_USER:?Set DB_APP_USER in .env.production}
      DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
      TZ: UTC
    secrets:
      - postgres_admin_password
      - db_app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - data
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1024m}
    pids_limit: 256
    logging: *default-logging

  backend:
    image: exchangehub-backend:${RELEASE_TAG:?Set RELEASE_TAG in .env.production}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
      DB_USER: ${DB_APP_USER:?Set DB_APP_USER in .env.production}
      DEMO_DATA_ENABLED: "false"
      TZ: UTC
    secrets:
      - source: db_app_password
        target: spring.datasource.password
      - source: jwt_secret
        target: app.jwt.secret
      - source: bootstrap_admin_email
        target: app.bootstrap-admin.email
      - source: bootstrap_admin_name
        target: app.bootstrap-admin.name
      - source: bootstrap_admin_password
        target: app.bootstrap-admin.password
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - edge
      - data
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1024m}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging: *default-logging

  frontend:
    image: exchangehub-frontend:${RELEASE_TAG:?Set RELEASE_TAG in .env.production}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - edge
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    logging: *default-logging

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    logging: *default-logging

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_admin_password:
    file: ${SECRETS_DIR:?Set SECRETS_DIR in .env.production}/postgres_admin_password
  db_app_password:
    file: ${SECRETS_DIR:?Set SECRETS_DIR in .env.production}/db_app_password
  jwt_secret:
    file: ${SECRETS_DIR:?Set SECRETS_DIR in .env.production}/jwt_secret
  bootstrap_admin_email:
    file: ${SECRETS_DIR:?Set SECRETS_DIR in .env.production}/bootstrap_admin_email
  bootstrap_admin_name:
    file: ${SECRETS_DIR:?Set SECRETS_DIR in .env.production}/bootstrap_admin_name
  bootstrap_admin_password:
    file: ${SECRETS_DIR:?Set SECRETS_DIR in .env.production}/bootstrap_admin_password
