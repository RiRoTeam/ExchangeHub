spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:temka}
    username: ${DB_USER:temka}
    password: ${DB_PASSWORD:temka}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  # Let Tomcat resolve X-Forwarded-* only when the immediate peer is one of its
  # trusted internal proxies (for example the compose nginx container).
  forward-headers-strategy: native

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000           # 15 minutes
    refresh-expiration-ms: 2592000000 # 30 days
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    name: ${BOOTSTRAP_ADMIN_NAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
