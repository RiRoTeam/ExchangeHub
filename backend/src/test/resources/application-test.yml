spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

app:
  refresh-token-cleanup:
    enabled: false
  jwt:
    secret: test-secret-key-must-be-at-least-32-chars-long
    expiration-ms: 900000
    refresh-expiration-ms: 2592000000

rate-limit:
  login:
    capacity: 1000
  register:
    capacity: 1000
  refresh:
    capacity: 1000
