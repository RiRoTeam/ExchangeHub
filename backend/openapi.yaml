openapi: 3.0.3
info:
  title: ExchangeHub API
  version: 1.1.0
  description: |
    REST API for the ExchangeHub program catalog, user workflows and administration.

    Access tokens are Bearer JWTs valid for 15 minutes. Refresh tokens are valid
    for 30 days and can be rotated with `/api/auth/refresh` or revoked with
    `/api/auth/logout`.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Auth
  - name: Programs
  - name: Users
  - name: Submissions
  - name: Admin

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user and return a token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and return a token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a valid refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      description: Idempotent. An already revoked or unknown token is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Token is no longer valid
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the current user's profile and role
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/programs:
    get:
      tags: [Programs]
      summary: List active programs
      description: All filters are optional. Pagination is zero-based.
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ProgramType'
        - name: country
          in: query
          description: Case-insensitive partial match; `%`, `_` and `\\` are treated literally.
          schema:
            type: string
        - name: q
          in: query
          description: Case-insensitive partial match in title or description.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: |
            `field,direction`, where field is `createdAt`, `deadline`, `title` or
            `country`, and direction is `asc` or `desc`. Aliases
            `created_at_desc` and `deadline_asc` are also accepted.
          schema:
            type: string
            default: createdAt,desc
      responses:
        '200':
          description: Stable paginated response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/programs/{id}:
    get:
      tags: [Programs]
      summary: Get a program by ID
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Program details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/programs/{id}/events:
    post:
      tags: [Programs]
      summary: Record a view or outbound-link click
      description: Public endpoint, limited to 120 events per minute per client IP.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramAnalyticsEventRequest'
      responses:
        '204':
          description: Event recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/users/me:
    patch:
      tags: [Users]
      summary: Update the current user's name and/or password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/favorites:
    get:
      tags: [Users]
      summary: List the current user's favorite programs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Favorites ordered by most recently added
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/favorites/{programId}:
    parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Users]
      summary: Add a favorite
      description: Idempotent.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Favorite exists
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Remove a favorite
      description: Idempotent.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Favorite does not exist
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/submissions:
    post:
      tags: [Submissions]
      summary: Submit a program for review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
      responses:
        '201':
          description: Pending submission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/submissions/my:
    get:
      tags: [Submissions]
      summary: List the current user's submissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Submissions ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/users:
    get:
      tags: [Admin]
      summary: List users and roles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/users/{id}/role:
    patch:
      tags: [Admin]
      summary: Change a user's role and revoke their refresh tokens
      description: The final administrator cannot be demoted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/submissions:
    get:
      tags: [Admin]
      summary: List pending submissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending moderation queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/submissions/{id}:
    patch:
      tags: [Admin]
      summary: Approve or reject a pending submission
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewSubmissionRequest'
      responses:
        '200':
          description: Reviewed submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/analytics:
    get:
      tags: [Admin]
      summary: Get platform and program engagement analytics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Totals and up to ten programs ranked by total engagement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/programs:
    post:
      tags: [Admin]
      summary: Create a program
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRequest'
      responses:
        '201':
          description: Program created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/programs/{id}:
    put:
      tags: [Admin]
      summary: Replace a program's editable fields
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRequest'
      responses:
        '200':
          description: Program updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      summary: Delete a program
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Program deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Invalid request or validation failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Insufficient role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Business invariant conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until retry is allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    Role:
      type: string
      enum: [USER, ADMIN]
    ProgramType:
      type: string
      enum: [INTERNSHIP, EXCHANGE, SCHOLARSHIP, OTHER]
    ProgramStatus:
      type: string
      enum: [ACTIVE, INACTIVE, DRAFT]
    SubmissionStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          minLength: 6
          maxLength: 72
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
    AuthResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    UserResponse:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    UpdateProfileRequest:
      type: object
      description: "`currentPassword` is required when `newPassword` is supplied."
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        currentPassword:
          type: string
          maxLength: 72
        newPassword:
          type: string
          minLength: 6
          maxLength: 72
    AdminUserResponse:
      allOf:
        - $ref: '#/components/schemas/UserResponse'
        - type: object
          required: [createdAt]
          properties:
            createdAt:
              type: string
              format: date-time
    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    ProgramRequest:
      type: object
      required: [title, description, country, type]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 5000
        country:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/ProgramType'
        deadline:
          type: string
          format: date
          nullable: true
          description: Today or a future date.
        url:
          type: string
          format: uri
          maxLength: 500
          nullable: true
    ProgramResponse:
      allOf:
        - $ref: '#/components/schemas/ProgramRequest'
        - type: object
          required: [id, status, createdAt]
          properties:
            id:
              type: integer
              format: int64
            status:
              $ref: '#/components/schemas/ProgramStatus'
            createdAt:
              type: string
              format: date-time
    ProgramPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProgramResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
    PageMetadata:
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
        number:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    ProgramAnalyticsEventRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [VIEW, CLICK]

    SubmissionRequest:
      allOf:
        - $ref: '#/components/schemas/ProgramRequest'
    SubmissionResponse:
      allOf:
        - $ref: '#/components/schemas/SubmissionRequest'
        - type: object
          required: [id, userId, userName, status, createdAt]
          properties:
            id:
              type: integer
              format: int64
            userId:
              type: integer
              format: int64
            userName:
              type: string
            status:
              $ref: '#/components/schemas/SubmissionStatus'
            adminComment:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            reviewedAt:
              type: string
              format: date-time
              nullable: true
    ReviewSubmissionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]
        comment:
          type: string
          nullable: true

    AdminAnalyticsResponse:
      type: object
      required: [users, programs, submissions, favorites, views, clicks, topPrograms, dailyEngagement]
      properties:
        users:
          type: integer
          format: int64
        programs:
          type: integer
          format: int64
        submissions:
          type: integer
          format: int64
        favorites:
          type: integer
          format: int64
        views:
          type: integer
          format: int64
        clicks:
          type: integer
          format: int64
        topPrograms:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/TopProgramAnalyticsResponse'
        dailyEngagement:
          type: array
          minItems: 30
          maxItems: 30
          description: Platform-wide VIEW and CLICK totals for each of the last 30 calendar days.
          items:
            $ref: '#/components/schemas/DailyEngagementResponse'
    TopProgramAnalyticsResponse:
      type: object
      required: [id, title, views, clicks, favorites, totalEngagement]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        views:
          type: integer
          format: int64
        clicks:
          type: integer
          format: int64
        favorites:
          type: integer
          format: int64
        totalEngagement:
          type: integer
          format: int64

    DailyEngagementResponse:
      type: object
      required: [date, views, clicks, totalEngagement]
      properties:
        date:
          type: string
          format: date
        views:
          type: integer
          format: int64
        clicks:
          type: integer
          format: int64
        totalEngagement:
          type: integer
          format: int64

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: object
          additionalProperties:
            type: string
