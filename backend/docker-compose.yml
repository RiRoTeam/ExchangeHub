# Для запуска только бэкенда с БД (без фронта).
# Для полного локального стека используй docker-compose.yml в корне репозитория.
services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-exchangehub}
      POSTGRES_USER: ${DB_USER:-exchangehub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-exchangehub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-exchangehub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-exchangehub}
      DB_USER: ${DB_USER:-exchangehub}
      DB_PASSWORD: ${DB_PASSWORD:-exchangehub}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-must-be-at-least-32-chars}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
