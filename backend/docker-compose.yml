services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: temka
      POSTGRES_USER: temka
      POSTGRES_PASSWORD: temka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temka"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: temka
      DB_USER: temka
      DB_PASSWORD: temka
      JWT_SECRET: change-me-in-production-must-be-at-least-32-chars
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
