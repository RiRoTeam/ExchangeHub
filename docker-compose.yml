services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-exchangehub}
      POSTGRES_USER: ${DB_USER:-exchangehub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-exchangehub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-exchangehub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (Spring Boot + Flyway миграции) ──────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-exchangehub}
      DB_USER: ${DB_USER:-exchangehub}
      DB_PASSWORD: ${DB_PASSWORD:-exchangehub}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-must-be-at-least-32-chars}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/api/programs?size=1' >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── Frontend (React admin panel) ─────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
